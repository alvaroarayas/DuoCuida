spring:
  application:
    name: evaluaciones
  datasource:
    url: jdbc:mariadb://localhost:3306/duocuida_evaluaciones_db?createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8085